website:
  site-url: "https://erikwestlund.github.io/php-stats/"
  title: "PHP Stats"
  sidebar:
    style: docked
    search: true
    contents:
      - index.qmd
      - section: "Project"
        contents:
          - visualization.qmd
          - licensing.qmd
          - v0.1.qmd
          - v0.2.qmd
          - design-philosophy.qmd
          - contracts.qmd
          - formulas.qmd
          - r-compatibility.qmd
          - missing-data.qmd
          - development.qmd
          - deployment.qmd
          - verification.qmd
          - draw-numerics.qmd
          - benchmarks/draws.qmd
          - io.qmd
          - documentation.qmd
      - href: notebooks/index.qmd
        text: Walkthrough index
      - section: "Probability distributions & statistical utilities"
        contents:
          - distributions.qmd
          - descriptive.qmd
          - rng.qmd
          - benchmarks/rng.qmd
          - verifications/distributions.qmd
          - benchmarks/distributions.qmd
      - section: "OLS"
        contents:
          - href: notebooks/ols-math.qmd
            text: Estimation walkthrough
          - href: notebooks/ols-verification.qmd
            text: R and statsmodels comparison
          - href: verifications/ols.qmd
            text: Verification record
          - href: benchmarks/ols.qmd
            text: Scale and performance
          - href: ols-math.qmd
            text: Math and Rust implementation notes
      - section: "Binary logistic regression"
        contents:
          - href: notebooks/logistic-math.qmd
            text: Estimation walkthrough
          - href: notebooks/logistic-verification.qmd
            text: R and statsmodels comparison
          - href: verifications/logistic.qmd
            text: Verification record
          - href: benchmarks/logistic.qmd
            text: Scale and performance
      - section: "Probit regression"
        contents:
          - href: notebooks/probit-math.qmd
            text: Estimation walkthrough
          - href: notebooks/probit-verification.qmd
            text: R and statsmodels comparison
          - href: verifications/probit.qmd
            text: Verification record
          - href: benchmarks/probit.qmd
            text: Scale and performance
      - section: "Poisson regression"
        contents:
          - href: notebooks/poisson-math.qmd
            text: Estimation walkthrough
          - href: notebooks/poisson-verification.qmd
            text: R and statsmodels comparison
          - href: verifications/poisson.qmd
            text: Verification record
          - href: benchmarks/poisson.qmd
            text: Scale and performance
      - section: "Gaussian mixed model"
        contents:
          - href: notebooks/lmm-general-math.qmd
            text: Random slopes and REML walkthrough
          - href: notebooks/r-compatibility.qmd
            text: Expanded R and optimizer audit
          - href: notebooks/lmm-math.qmd
            text: Estimation walkthrough
          - href: notebooks/lmm-verification.qmd
            text: Synthetic reference comparison
          - href: notebooks/lmm-public-verification.qmd
            text: Published dataset comparison
          - href: verifications/lmm.qmd
            text: Verification record
          - href: benchmarks/lmm.qmd
            text: Scale and performance

      - section: "Binomial mixed models"
        contents:
          - href: notebooks/logistic-mixed-math.qmd
            text: Likelihood and integration walkthrough
          - href: notebooks/logistic-mixed-verification.qmd
            text: R and independent Python verification
          - href: benchmarks/logistic-mixed.qmd
            text: Scale and performance

format:
  html:
    theme: cosmo
    toc: true
    code-copy: true
    html-math-method: mathjax

execute:
  freeze: true
  error: false
  daemon: false
